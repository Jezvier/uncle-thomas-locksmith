# Once a day: fetch the Google rating + review count, and if they changed,
# rebuild the site, commit, and publish to Cloudflare Pages.
#
# Needs repo secrets:
#   PLACES_API_KEY         – Google Maps Platform key with "Places API (New)" enabled
#   PLACE_ID (optional)    – speeds up the lookup; printed in this job's log on first run
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID – same as the deploy workflow
# Without PLACES_API_KEY the job does nothing.
name: Update Google rating

on:
  schedule:
    - cron: "17 19 * * *"   # 03:17 Singapore time
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rating:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rating
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PLACE_ID: ${{ secrets.PLACE_ID }}
        run: python3 _build/update_rating.py

      - name: Rebuild if changed
        id: build
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          pip install --quiet pillow
          python3 _build/build.py
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add -A
          git commit -m "Update Google rating"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this job don't trigger the deploy workflow, so publish here.
      - name: Collect public files
        if: steps.build.outputs.changed == 'true'
        run: |
          mkdir dist
          git archive HEAD | tar -x -C dist
          rm -rf dist/_build dist/.kiro dist/.github dist/README.md dist/.gitignore dist/assets/photos dist/CNAME

      - name: Deploy
        if: steps.build.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=singapore-locksmiths --branch=main --commit-dirty=true
